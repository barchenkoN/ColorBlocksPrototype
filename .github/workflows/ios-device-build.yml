name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - agent/final-submission
    paths:
      - ".github/workflows/ios-device-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-device-build
  cancel-in-progress: true

jobs:
  compile-ios:
    name: Compile Xcode project on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Download Unity-generated Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p input ios-src
          gh release download ios-input-133e591 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "ColorBlocks-iOS-Xcode.zip" \
            --dir input
          ditto -x -k input/ColorBlocks-iOS-Xcode.zip ios-src
          test -f ios-src/Unity-iPhone.xcodeproj/project.pbxproj
          cp Assets/_Game/Plugins/iOS/ColorBlocksHaptics.mm \
            ios-src/Libraries/_Game/Plugins/iOS/ColorBlocksHaptics.mm
          find ios-src -type f -name "*.sh" -exec chmod +x {} \;
          find ios-src -type f -iname "usymtool*" -exec chmod +x {} \;

      - name: Validate Xcode scheme
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios-src/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -list

      - name: Compile unsigned device application
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios-src/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -n 1)"
          test -n "${APP_PATH}"
          test -f "${APP_PATH}/Info.plist"
          mkdir -p build/Payload
          ditto "${APP_PATH}" "build/Payload/ColorBlocksPrototype.app"
          (
            cd build
            ditto -c -k --sequesterRsrc --keepParent Payload ColorBlocksPrototype-unsigned.ipa
          )
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "${APP_PATH}/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "${APP_PATH}/Info.plist"
          shasum -a 256 build/ColorBlocksPrototype-unsigned.ipa > build/ColorBlocksPrototype-unsigned.ipa.sha256
          ls -lh build/ColorBlocksPrototype-unsigned.ipa

      - name: Upload unsigned IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: ColorBlocksPrototype-unsigned-iOS
          path: |
            build/ColorBlocksPrototype-unsigned.ipa
            build/ColorBlocksPrototype-unsigned.ipa.sha256
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 3
